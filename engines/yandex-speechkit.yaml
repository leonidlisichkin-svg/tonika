id: yandex-speechkit
name: Yandex SpeechKit
notation: plus
languages: [ru]
notes: >
  Put "+" directly before the stressed vowel: "зам+ок". Stress markup is supported for Russian
  only, through API v3 and API v1 (text input). Phonemes go in double square brackets.
