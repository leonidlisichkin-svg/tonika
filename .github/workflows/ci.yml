name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install
        run: uv sync --python "${{ matrix.python }}"
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Offline tests
        run: uv run pytest -m "not models"
      - name: Proof command
        run: |
          out="$(uv run tonika annotate --lang ru --target plus "В старом замке сломался замок.")"
          echo "$out"
          test "$out" = "В старом з+амке сломался зам+ок."

  models:
    name: Tests with real models
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install
        run: uv sync --all-extras
      - name: Model tests
        # Exit code 5 means "no tests collected": expected until Phase 1 adds model tests.
        run: uv run pytest -m models || [ $? -eq 5 ]
