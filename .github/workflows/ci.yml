name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install
        run: uv sync --python "${{ matrix.python }}"
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Offline tests
        run: uv run pytest -m "not models"
      - name: Proof command
        run: |
          out="$(uv run tonika annotate --lang ru --target plus "В старом замке сломался замок.")"
          echo "$out"
          test "$out" = "В старом з+амке сломался зам+ок."

  models:
    name: Real models, tests and accuracy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install with the Russian pack
        run: uv sync --extra ru
      - name: Tests with real models
        id: tests
        run: |
          set +e
          uv run pytest -m models -q -p no:cacheprovider 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Accuracy on the golden set
        id: accuracy
        run: |
          set +e
          uv run tonika eval data/golden/ru.txt --lang ru \
            --baseline data/golden/baseline.json > accuracy.md 2> accuracy.log
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat accuracy.md accuracy.log
          exit 0
      - name: Long-text trial
        id: trial
        run: |
          set +e
          uv run tonika trial data/trials/ru/chekhov-lady-with-the-dog.txt --lang ru \
            --document trial-document.json > trial.md 2> trial.log
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat trial.md trial.log
          exit 0
      - name: Save the trial's Intent Document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-document-${{ github.run_id }}-${{ github.run_attempt }}
          path: trial-document.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTS: ${{ steps.tests.outputs.status }}
          ACCURACY: ${{ steps.accuracy.outputs.status }}
          TRIAL: ${{ steps.trial.outputs.status }}
        run: |
          {
            if [ "$TESTS" = "0" ]; then
              echo "**Tests with real models:** passed"
            else
              echo "**Tests with real models:** FAILED"
              echo
              echo '```'
              tail -n 80 tests.log
              echo '```'
            fi
            echo
            if [ -s accuracy.md ]; then cat accuracy.md; else
              echo "**Accuracy run failed**"
              echo
              echo '```'
              tail -n 40 accuracy.log
              echo '```'
            fi
            echo
            if [ -s trial.md ]; then cat trial.md; else
              echo "**Long-text trial failed to run**"
              echo
              echo '```'
              tail -n 40 trial.log
              echo '```'
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md --edit-last --create-if-none \
              || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md \
              || echo "could not comment on the pull request"
          fi
          test "$TESTS" = "0" && test "$ACCURACY" = "0" && test "$TRIAL" = "0"
